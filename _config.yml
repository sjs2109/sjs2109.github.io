title: 다섯시사십분의 노트
author: 다섯시사십분
url: https://sjs2109.github.io
baseurl: ""
description: >-
  읽고, 만들고, 다시 생각한 것을 한 편의 글로 남깁니다.
lang: ko
timezone: Asia/Seoul
permalink: /:slug

theme_config:
  appearance: "auto"
  appearance_toggle: true
  date_format: "%Y-%m-%d"
  show_description: true
  show_navbar: true
  show_footer: true
  show_copyright: true
  show_projects: false
  show_blog: true
  show_old_projects: false
  show_misc_list: false
  show_reading_time: true
  show_tags: true
  show_code_copy: true
  show_progress_bar: true
  show_back_to_top: true
  show_post_nav: true
  show_toc: true
  show_footnote_tooltips: true
  show_link_previews: true
  home:
    title_projects: Projects
    title_misc_list: Details
    title_blog: 글
    title_old_projects: Archive

highlighter: rouge

sass:
  style: :compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE.txt
  - .ruby-version
  - vendor
